<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FF4757">
  <title>黑视频 - 首页</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --primary: #FF4757; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f3f4f6; overscroll-behavior-y: contain; }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .card-shadow { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .nav-active { color: #FF4757; }
    .nav-inactive { color: #9ca3af; }
    @keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse-dot { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    @keyframes spin { to { transform: rotate(360deg); } }
    .fade-in-up { animation: fadeInUp 0.4s ease both; }
    .loading-spin { animation: spin 1s linear infinite; }
    .like-pop { animation: likeAnim 0.3s ease; }
    @keyframes likeAnim { 0%{transform:scale(1)} 50%{transform:scale(1.4)} 100%{transform:scale(1)} }
    .banner-slide { transition: transform 0.4s cubic-bezier(0.25,0.46,0.45,0.94); }
    .category-tab { white-space: nowrap; transition: all 0.2s; }
    .category-tab.active { color: #FF4757; border-bottom: 2px solid #FF4757; }
    .back-top-btn { transition: all 0.3s; }
    .progress-bar { height: 3px; background: linear-gradient(to right, #FF4757, #ff6b7a); border-radius: 2px; }
    .ctx-menu { transform: scale(0.95); opacity: 0; transition: all 0.15s; pointer-events: none; }
    .ctx-menu.show { transform: scale(1); opacity: 1; pointer-events: auto; }
    .refresh-hint { transition: all 0.3s; }
  </style>
</head>
<body class="bg-gray-100">

<!-- Fixed Header -->
<header class="fixed top-0 left-0 right-0 z-50 bg-white safe-top" style="box-shadow:0 1px 0 rgba(0,0,0,0.08)">
  <div class="flex items-center justify-between px-4 h-12">
    <div class="flex items-center gap-1.5">
      <div class="w-7 h-7 rounded-lg flex items-center justify-center" style="background:#FF4757">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <polygon points="4,2 14,8 4,14" fill="white"/>
        </svg>
      </div>
      <span class="font-bold text-lg tracking-tight" style="color:#FF4757">黑视频</span>
    </div>
    <div class="flex items-center gap-3">
      <button class="relative p-1" onclick="showNotif()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <span class="absolute top-0 right-0 w-2 h-2 rounded-full" style="background:#FF4757"></span>
      </button>
      <button class="p-1" onclick="window.location.href='search.html'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
  </div>
  <!-- Category Tabs -->
  <div class="overflow-x-auto scrollbar-hide border-t border-gray-50">
    <div class="flex px-2 gap-1" id="categoryTabs">
      <button class="category-tab active px-3 py-2.5 text-sm font-medium" onclick="switchTab(this,'推荐')">推荐</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'热门')">热门</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'最新')">最新</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'关注')">关注</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'游戏')">游戏</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'音乐')">音乐</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'影视')">影视</button>
      <button class="category-tab px-3 py-2.5 text-sm font-medium text-gray-600" onclick="switchTab(this,'学习')">学习</button>
    </div>
  </div>
</header>

<!-- Pull to refresh hint -->
<div id="refreshHint" class="refresh-hint fixed z-40 left-0 right-0 flex justify-center" style="top:96px;opacity:0;pointer-events:none">
  <div class="bg-white rounded-full px-3 py-1.5 flex items-center gap-1.5 card-shadow text-xs text-gray-500">
    <svg class="loading-spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    松开刷新

</div>

<!-- Main Content -->
<main class="pt-24 pb-20" id="mainContent">

  <div class="relative overflow-hidden mx-3 mt-1 mb-3 rounded-xl" style="height:160px" id="bannerWrap">

        </div>

      <div class="w-1/3 h-40 flex-shrink-0 relative" style="background:linear-gradient(135deg,#2ed573,#1e9e4d)">
        <div class="absolute inset-0 flex flex-col justify-end p-4">
          <span class="text-white text-xs bg-black bg-opacity-30 rounded px-2 py-0.5 w-fit mb-1">🎮 游戏专区</span>
          <p class="text-white font-bold text-base leading-tight">2024最火游戏BGM合集精选版</p>
          <p class="text-white text-xs opacity-80 mt-0.5">游戏BGM博主 · 9.3万次观看</p>
        </div>
      </div>
    </div>
    <!-- Dot indicators -->
    <div class="absolute bottom-2 left-0 right-0 flex justify-center gap-1.5" id="bannerDots">
      <span class="w-4 h-1.5 rounded-full bg-white transition-all" id="dot0"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-white opacity-50 transition-all" id="dot1"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-white opacity-50 transition-all" id="dot2"></span>
    </div>
  </div>

  <!-- Video Grid -->
  <div class="px-3 grid grid-cols-2 gap-3" id="videoGrid">

  </div>

  <!-- Loading indicator -->
  <div class="flex justify-center items-center py-6 gap-2" id="loadingIndicator">
    <div class="w-4 h-4 rounded-full border-2 border-gray-300 border-t-red-500 loading-spin"></div>
    <span class="text-xs text-gray-400">加载更多...</span>
  </div>

</main>

<!-- Context Menu (Not Interested) -->
<div id="ctxMenu" class="ctx-menu fixed z-50 bg-white rounded-xl card-shadow overflow-hidden" style="min-width:150px">
  <button class="flex items-center gap-2 px-4 py-3 w-full text-left text-sm text-gray-700 hover:bg-gray-50" onclick="notInterested()">

  <button class="flex items-center gap-2 px-4 py-3 w-full text-left text-sm text-gray-700 hover:bg-gray-50" onclick="closeCtx()">

  <button class="flex items-center gap-2 px-4 py-3 w-full text-left text-sm text-gray-700 hover:bg-gray-50" onclick="closeCtx()">

    屏蔽作者

<div id="ctxOverlay" class="fixed inset-0 z-40" style="display:none" onclick="closeCtx()"></div>

<!-- Back to top button -->

</button>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-white z-50 safe-bottom" style="box-shadow:0 -1px 0 rgba(0,0,0,0.08)">
  <div class="flex h-14">
    <a href="index.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 nav-active">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#FF4757" stroke="none"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22" fill="white"/></svg>

      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="text-xs">搜索</span>
    </a>
    <a href="category.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 nav-inactive">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="text-xs">发现</span>
    </a>
    <a href="profile.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 nav-inactive">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="text-xs">我的</span>

</nav>

<!-- Notification Toast -->
<div id="notifToast" class="fixed top-20 left-4 right-4 z-50 bg-white rounded-xl card-shadow p-3 flex items-center gap-3 opacity-0 pointer-events-none transition-all duration-300">
  <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:#FF4757">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
  </div>
  <div>
    <p class="text-xs font-medium text-gray-800">你有3条新消息</p>
    <p class="text-xs text-gray-400">游戏BGM博主 回复了你的评论</p>
  </div>
</div>

<script>
// ─── Mock Data ───────────────────────────────────────────────
const videos = [
  { id:1, title:'【震撼】全球最美的10个自然奇观', author:'自然探索频道', views:'21.4万', time:'2天前', duration:'15:32', gradient:'linear-gradient(135deg,#FF4757,#ff6348)', avatarBg:'#FF4757' },
  { id:2, title:'学会这5个技巧，Python编程效率翻倍', author:'Python小课堂', views:'5.8万', time:'1天前', duration:'28:14', gradient:'linear-gradient(135deg,#5352ED,#3742fa)', avatarBg:'#5352ED' },
  { id:3, title:'2024最火游戏BGM合集精选', author:'游戏BGM博主', views:'93.2万', time:'3小时前', duration:'45:00', gradient:'linear-gradient(135deg,#2ed573,#1e9e4d)', avatarBg:'#2ed573' },
  { id:4, title:'手把手教你做红烧肉，简单好吃不失败', author:'美食大厨老王', views:'12.6万', time:'5小时前', duration:'18:45', gradient:'linear-gradient(135deg,#ffa502,#e67e22)', avatarBg:'#ffa502' },
  { id:5, title:'探秘世界各地神秘废墟遗址', author:'探险达人', views:'8.3万', time:'1周前', duration:'22:18', gradient:'linear-gradient(135deg,#747d8c,#57606f)', avatarBg:'#747d8c' },
  { id:6, title:'当代年轻人的真实生活状态纪录', author:'生活记录者', views:'44.7万', time:'4天前', duration:'35:22', gradient:'linear-gradient(135deg,#ff6b81,#c44569)', avatarBg:'#ff6b81' },
  { id:7, title:'极限运动精彩瞬间集锦4K版', author:'极限运动集锦', views:'67.1万', time:'6小时前', duration:'12:05', gradient:'linear-gradient(135deg,#00d2d3,#0097a7)', avatarBg:'#00d2d3' },
  { id:8, title:'古典音乐入门指南 从零开始听懂巴赫', author:'古典音乐爱好者', views:'3.2万', time:'2周前', duration:'41:30', gradient:'linear-gradient(135deg,#a29bfe,#6c5ce7)', avatarBg:'#a29bfe' },
  { id:9, title:'城市夜景摄影技巧完全手册', author:'摄影师阿明', views:'18.9万', time:'3天前', duration:'20:15', gradient:'linear-gradient(135deg,#fdcb6e,#e17055)', avatarBg:'#fdcb6e' },
  { id:10, title:'健身入门必看：零基础30天计划', author:'健身达人小李', views:'55.4万', time:'1周前', duration:'33:48', gradient:'linear-gradient(135deg,#55efc4,#00b894)', avatarBg:'#55efc4' },
];

// ─── Render Video Cards ──────────────────────────────────────
function renderCards(list) {
  const grid = document.getElementById('videoGrid');
  list.forEach((v, i) => {
    const card = document.createElement('div');
    card.className = 'bg-white rounded-xl overflow-hidden card-shadow fade-in-up cursor-pointer';
    card.style.animationDelay = `${i * 0.05}s`;
    card.innerHTML = `
      <div class="relative" style="padding-top:56.25%;background:${v.gradient}">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-10 h-10 rounded-full bg-black bg-opacity-40 flex items-center justify-center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <span class="absolute bottom-1.5 right-1.5 bg-black bg-opacity-70 text-white text-xs px-1.5 py-0.5 rounded">${v.duration}</span>
        <button class="absolute top-1.5 right-1.5 w-6 h-6 bg-black bg-opacity-40 rounded-full flex items-center justify-center" onclick="openCtx(event,${v.id})">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
        </button>
      </div>
      <div class="p-2">
        <p class="text-xs font-medium text-gray-800 leading-tight line-clamp-2 mb-2">${v.title}</p>
        <div class="flex items-center gap-1.5">
          <div class="w-5 h-5 rounded-full flex-shrink-0" style="background:${v.avatarBg}"></div>
          <span class="text-xs text-gray-500 truncate flex-1">${v.author}</span>
        </div>
        <div class="flex items-center gap-1 mt-1">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="text-xs text-gray-400">${v.views}</span>
          <span class="text-gray-300 text-xs mx-0.5">·</span>
          <span class="text-xs text-gray-400">${v.time}</span>
        </div>
      </div>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      window.location.href = 'video.html';
    });
    card.addEventListener('contextmenu', (e) => { e.preventDefault(); openCtx(e, v.id); });
    grid.appendChild(card);
  });
}

renderCards(videos);

// ─── Category Tabs ───────────────────────────────────────────
function switchTab(el, name) {
  document.querySelectorAll('.category-tab').forEach(t => {
    t.classList.remove('active');
    t.classList.add('text-gray-600');
    t.style.color = '';
  });
  el.classList.add('active');
  el.classList.remove('text-gray-600');
  el.scrollIntoView({ behavior:'smooth', block:'nearest', inline:'center' });
  // Simulate refresh
  const grid = document.getElementById('videoGrid');
  grid.style.opacity = '0.5';
  setTimeout(() => {
    const shuffled = [...videos].sort(() => Math.random() - 0.5);
    grid.innerHTML = '';
    renderCards(shuffled);
    grid.style.opacity = '1';
  }, 400);
}

// ─── Banner Carousel ─────────────────────────────────────────
let bannerIdx = 0;
function slideBanner(idx) {
  bannerIdx = (idx + 3) % 3;
  document.getElementById('bannerTrack').style.transform = `translateX(-${bannerIdx * 33.333}%)`;
  [0,1,2].forEach(i => {
    const dot = document.getElementById('dot' + i);
    dot.style.width = i === bannerIdx ? '16px' : '6px';
    dot.style.opacity = i === bannerIdx ? '1' : '0.5';
  });
}
setInterval(() => slideBanner(bannerIdx + 1), 3000);
// Swipe banner
let bStartX = 0;
const bTrack = document.getElementById('bannerTrack');
bTrack.addEventListener('touchstart', e => { bStartX = e.touches[0].clientX; });
bTrack.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - bStartX;
  if (Math.abs(dx) > 40) slideBanner(dx < 0 ? bannerIdx + 1 : bannerIdx - 1);
});

// ─── Scroll Events ───────────────────────────────────────────
const backBtn = document.getElementById('backTopBtn');
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  if (y > 300) {
    backBtn.style.opacity = '1';
    backBtn.style.pointerEvents = 'auto';
  } else {
    backBtn.style.opacity = '0';
    backBtn.style.pointerEvents = 'none';
  }
  // Infinite scroll
  const distFromBottom = document.body.scrollHeight - window.scrollY - window.innerHeight;
  if (distFromBottom < 200) triggerLoadMore();
});

let loading = false;
function triggerLoadMore() {
  if (loading) return;
  loading = true;
  setTimeout(() => {
    const extra = [...videos].sort(() => Math.random() - 0.5).slice(0, 4);
    renderCards(extra);
    loading = false;
  }, 1200);
}

function scrollToTop() { window.scrollTo({ top:0, behavior:'smooth' }); }

// ─── Context Menu ─────────────────────────────────────────────
let ctxTargetId = null;
function openCtx(e, id) {
  e.stopPropagation();
  ctxTargetId = id;
  const menu = document.getElementById('ctxMenu');
  const overlay = document.getElementById('ctxOverlay');
  const x = Math.min(e.clientX, window.innerWidth - 170);
  const y = Math.min(e.clientY, window.innerHeight - 160);
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.classList.add('show');
  overlay.style.display = 'block';
}
function closeCtx() {
  document.getElementById('ctxMenu').classList.remove('show');
  document.getElementById('ctxOverlay').style.display = 'none';
}
function notInterested() {
  closeCtx();
  const grid = document.getElementById('videoGrid');
  const cards = grid.children;
  if (cards.length > 0) {
    const card = cards[Math.floor(Math.random() * cards.length)];
    card.style.transition = 'all 0.3s';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.9)';
    setTimeout(() => card.remove(), 300);
  }
  showToastMsg('已标记为不感兴趣');
}

// ─── Notification ─────────────────────────────────────────────
function showNotif() {
  const t = document.getElementById('notifToast');
  t.style.opacity = '1';
  t.style.pointerEvents = 'auto';
  setTimeout(() => { t.style.opacity = '0'; t.style.pointerEvents = 'none'; }, 3000);
}

function showToastMsg(msg) {
  const t = document.createElement('div');
  t.className = 'fixed z-50 left-1/2 -translate-x-1/2 bg-black bg-opacity-70 text-white text-xs px-4 py-2 rounded-full';
  t.style.bottom = '90px';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ─── Pull to Refresh ─────────────────────────────────────────
let pullStart = 0;
document.addEventListener('touchstart', e => { if (window.scrollY === 0) pullStart = e.touches[0].clientY; });
document.addEventListener('touchmove', e => {
  if (window.scrollY === 0 && pullStart > 0) {
    const dy = e.touches[0].clientY - pullStart;
    if (dy > 60) document.getElementById('refreshHint').style.opacity = '1';
  }
});
document.addEventListener('touchend', () => {
  const hint = document.getElementById('refreshHint');
  if (hint.style.opacity === '1') {
    setTimeout(() => {
      hint.style.opacity = '0';
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = '';
      renderCards([...videos].sort(() => Math.random() - 0.5));
      showToastMsg('刷新成功');
    }, 800);
  }
  pullStart = 0;
});
</script>
