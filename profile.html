    .settings-panel.open { transform:translateX(0); }
    .stat-num { font-variant-numeric: tabular-nums; }
    .video-grid-item:active { opacity:0.8; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

<script>
// ─── Data ─────────────────────────────────────────────────────
const postVideos = [
  { title:'我拍的城市夜景', duration:'5:22', gradient:'linear-gradient(135deg,#FF4757,#ff6348)', views:'1.2万' },
  { title:'旅途中的风景', duration:'8:45', gradient:'linear-gradient(135deg,#5352ED,#3742fa)', views:'8.6千' },
  { title:'日常vlog记录', duration:'12:30', gradient:'linear-gradient(135deg,#2ed573,#1e9e4d)', views:'3.4千' },
];
const favVideos = [
  { title:'【震撼】全球最美的10个自然奇观', duration:'15:32', gradient:'linear-gradient(135deg,#FF4757,#ff6348)', views:'21.4万' },
  { title:'学会这5个技巧，Python效率翻倍', duration:'28:14', gradient:'linear-gradient(135deg,#5352ED,#3742fa)', views:'5.8万' },
  { title:'2024最火游戏BGM合集', duration:'45:00', gradient:'linear-gradient(135deg,#2ed573,#1e9e4d)', views:'93.2万' },
  { title:'手把手教你做红烧肉', duration:'18:45', gradient:'linear-gradient(135deg,#ffa502,#e67e22)', views:'12.6万' },
  { title:'极限运动精彩瞬间集锦', duration:'12:05', gradient:'linear-gradient(135deg,#00d2d3,#0097a7)', views:'67.1万' },
  { title:'古典音乐入门指南', duration:'41:30', gradient:'linear-gradient(135deg,#a29bfe,#6c5ce7)', views:'3.2万' },
];
let historyVideos = [
  { title:'【震撼】全球最美的10个自然奇观', author:'自然探索频道', progress:65, time:'今天 14:32', gradient:'linear-gradient(135deg,#FF4757,#ff6348)' },
  { title:'学会这5个技巧，Python编程效率翻倍', author:'Python小课堂', progress:100, time:'今天 11:05', gradient:'linear-gradient(135deg,#5352ED,#3742fa)' },
  { title:'2024最火游戏BGM合集精选', author:'游戏BGM博主', progress:30, time:'昨天 22:15', gradient:'linear-gradient(135deg,#2ed573,#1e9e4d)' },
  { title:'手把手教你做红烧肉，简单好吃不失败', author:'美食大厨老王', progress:45, time:'昨天 18:40', gradient:'linear-gradient(135deg,#ffa502,#e67e22)' },
  { title:'探秘世界各地神秘废墟遗址', author:'探险达人', progress:80, time:'2天前', gradient:'linear-gradient(135deg,#747d8c,#57606f)' },
  { title:'当代年轻人的真实生活状态纪录', author:'生活记录者', progress:20, time:'3天前', gradient:'linear-gradient(135deg,#ff6b81,#c44569)' },
  { title:'极限运动精彩瞬间集锦4K版', author:'极限运动集锦', progress:100, time:'4天前', gradient:'linear-gradient(135deg,#00d2d3,#0097a7)' },
  { title:'古典音乐入门指南 从零开始听懂巴赫', author:'古典音乐爱好者', progress:55, time:'1周前', gradient:'linear-gradient(135deg,#a29bfe,#6c5ce7)' },
];

// ─── Init ─────────────────────────────────────────────────────
function init() {
  renderVideoGrid('postsGrid', postVideos);
  renderVideoGrid('favoritesGrid', favVideos);
  renderHistory();
}

function renderVideoGrid(containerId, items) {
  const g = document.getElementById(containerId);
  g.innerHTML = '';
  items.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'video-grid-item cursor-pointer fade-in';
    d.style.animationDelay = `${i * 0.05}s`;
    d.innerHTML = `
      <div class="relative rounded-lg overflow-hidden" style="padding-top:56.25%;background:${v.gradient}">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-7 h-7 rounded-full bg-black bg-opacity-30 flex items-center justify-center">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <span class="absolute bottom-1 right-1 text-white text-xs bg-black bg-opacity-60 px-1 rounded">${v.duration}</span>
      </div>
      <p class="text-xs text-gray-700 mt-1 leading-tight line-clamp-2">${v.title}</p>
      <p class="text-xs text-gray-400 mt-0.5">${v.views || ''}</p>`;
    d.onclick = () => window.location.href = 'video.html';
    g.appendChild(d);
  });
}

function renderHistory() {
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  historyVideos.forEach((v, i) => {
    const d = document.createElement('div');
    d.className = 'flex items-center gap-3 px-4 py-3';
    d.innerHTML = `
      <div class="relative flex-shrink-0 w-24 h-14 rounded-lg overflow-hidden cursor-pointer" style="background:${v.gradient}" onclick="window.location.href='video.html'">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-7 h-7 rounded-full bg-black bg-opacity-30 flex items-center justify-center">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
          </div>
        </div>
        <div class="absolute bottom-0 left-0 right-0 h-0.5 bg-white bg-opacity-30">
          <div class="h-full" style="width:${v.progress}%;background:#FF4757"></div>
        </div>
        ${v.progress === 100 ? '<div class="absolute top-1 right-1 bg-black bg-opacity-60 text-white text-xs px-1 rounded">已看完</div>' : ''}
      </div>
      <div class="flex-1 min-w-0 cursor-pointer" onclick="window.location.href='video.html'">
        <p class="text-xs font-medium text-gray-800 leading-tight line-clamp-2">${v.title}</p>
        <p class="text-xs text-gray-500 mt-1">${v.author}</p>
        <p class="text-xs text-gray-400 mt-0.5">${v.time}</p>
      </div>
      <button class="flex-shrink-0 p-2" onclick="removeHistory(${i})">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>`;
    list.appendChild(d);
  });
}

function removeHistory(i) {
  historyVideos.splice(i, 1);
  renderHistory();
  showToastMsg('已删除');
}

function clearAllHistory() {
  historyVideos = [];
  renderHistory();
  showToastMsg('已清除全部历史');
}

// ─── Tabs ─────────────────────────────────────────────────────
function switchTab(el, tab) {
  document.querySelectorAll('.profile-tab').forEach(t => { t.classList.remove('active'); t.classList.add('text-gray-500'); });
  el.classList.add('active'); el.classList.remove('text-gray-500');
  document.getElementById('postsTab').classList.toggle('hidden', tab !== 'posts');
  document.getElementById('favoritesTab').classList.toggle('hidden', tab !== 'favorites');
  document.getElementById('historyTab').classList.toggle('hidden', tab !== 'history');
}

// ─── Settings Panel ────────────────────────────────────────────
function openSettings() {
  document.getElementById('settingsOverlay').style.pointerEvents = 'auto';
  document.getElementById('settingsBg').style.display = 'block';
  document.getElementById('settingsPanel').classList.add('open');
}
function closeSettings() {
  document.getElementById('settingsOverlay').style.pointerEvents = 'none';
  document.getElementById('settingsBg').style.display = 'none';
  document.getElementById('settingsPanel').classList.remove('open');
}

let darkMode = false;
function toggleDarkMode(item) {
  darkMode = !darkMode;
  const toggle = document.getElementById('darkToggle');
  const thumb = document.getElementById('darkThumb');
  toggle.style.background = darkMode ? '#FF4757' : '';
  thumb.style.transform = darkMode ? 'translateX(20px)' : '';
  showToastMsg(darkMode ? '夜间模式已开启' : '夜间模式已关闭');
}

function logout() {
  closeSettings();
  showToastMsg('已退出登录');
  setTimeout(() => window.location.href = 'login.html', 1000);
}

// ─── Login state toggle (demo) ────────────────────────────────
function toggleLoginState() {
  document.getElementById('loginPrompt').classList.add('hidden');
  document.getElementById('profileCard').classList.remove('hidden');
}

// ─── Toast ────────────────────────────────────────────────────
function showToastMsg(msg) {
  const t = document.createElement('div');
  t.className = 'fixed z-50 left-1/2 bg-black bg-opacity-70 text-white text-xs px-4 py-2 rounded-full pointer-events-none';
  t.style.bottom = '90px'; t.style.transform = 'translateX(-50%)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity 0.3s'; }, 1500);
  setTimeout(() => t.remove(), 1800);
}

init();
</script>
</body>
</html>
